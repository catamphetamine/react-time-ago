<html>
	<head>
		<title>React Time Ago</title>

		<meta charset="utf-8"/>

		<link rel="stylesheet" href="./Tooltip.css"/>

		<!-- React 16.3.0 -->
		<script crossorigin src="https://unpkg.com/react@16/umd/react.development.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@16/umd/react-dom.development.js"></script>
		<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.7.2/prop-types.min.js"></script>

		<!-- Babel 6 -->
		<script src="./lib/babel.min.js"></script>
		<script src="./lib/babel-polyfill.min.js"></script>

		<script src="./lib/javascript-time-ago.js"></script>
		<script src="./lib/react-responsive-ui.min.js"></script>
		<script src="./locales.en.js"></script>
		<script src="./locales.ru.js"></script>

		<script src="./react-time-ago.js"></script>
	</head>

	<style>
		body
		{
			margin: 0;
			padding: 40px;
		}

		body, input, button
		{
			font-family: Arial, Helvetica;
			font-size: 20px;
		}

		h2
		{
			margin-top: 3em;
			margin-bottom: 1em;
			padding-bottom: 0.25em;
			border-bottom: 1px solid #afafaf;
		}

		h2:first-child
		{
			margin-top: 0;
		}

		.section
		{
			margin-top: 20px;
		}

		a
		{
			text-decoration: none;
			color: #0093C4;
		}

		a:hover
		{
			text-decoration: underline;
		}

		a.main
		{
			display: block;
			font-size: 32px;
		}

		p
		{
			margin-top: 10px;
			margin-bottom: 25px;
		}

		.date
		{
			margin-top: 30px;
			color: #9f9f9f;
		}

		.time-rows + .locale
		{
			margin-top: 2em;
		}

		.time-rows
		{
    	display: table;
		}

		.time
		{
			display: table-row;
		}

		.timeStyle,
		.time-label,
		.time-label-with-tooltip
		{
			display: table-cell;
			padding-top: 0.525em;
		}

		.time-label,
		.time-label-with-tooltip
		{
			padding-left: 3em;
		}

		time
		{
			font-weight: bold;
		}

		.case
		{
			margin-top: 3rem;
		}

		.case + .case
		{
			margin-top: 4rem;
		}

		.rrui__tooltip
		{
			font-size: 1rem;
		}

		code.code {
			color: #876c31;
		}

		.string-value {
			color: #00849e;
		}

		.not-specified {
			opacity: 0.5;
		}

		.locale {
			font-weight: normal;
			color: #6f6f6f;
		}
	</style>

	<body>
		<a target="_blank" class="main" href="https://www.npmjs.com/package/react-time-ago"><code>react-time-ago</code></a>

		<p>React component for relative date/time formatting</p>

		<p>
			<code class="code">&lt;TimeAgo date=<span class="string-value">{date}</span>/&gt;</code>
		</p>
		<p>
			Optional properties:&nbsp; <code class="code">locale=<span class="string-value">"…"</span></code><code class="code"> </code><code class="code">timeStyle=<span class="string-value">"…"</span></code>
		</p>

		<div id="content"></div>

		<script type="text/babel">
			const TEST = false

			const Tooltip = window['react-responsive-ui'].Tooltip

			TimeAgo.addLocale(window['javascript-time-ago/locales/en'])
			TimeAgo.addLocale(window['javascript-time-ago/locales/ru'])

			const dates = {
				recently      : new Date(),
				a_minute_ago  : new Date(Date.now() - 60 * 1000),
				two_hours_ago : new Date(Date.now() - 2 * 60 * 60 * 1000),
				a_day_ago     : new Date(Date.now() - 24 * 60 * 60 * 1000),
				a_year_ago    : new Date(Date.now() - 365 * 24 * 60 * 60 * 1000),
				in_15_minutes  : new Date(Date.now() + 15 * 60 * 1000)
			}

			function ReactTimeAgoWithTooltip(props) {
			  return (
			    <ReactTimeAgo
			      {...props}
			      wrapperComponent={TooltipContainer}
			      tooltip={false}
					/>
			  )
			}

			const TooltipContainer = ({ verboseDate, children, ...rest }) => (
				<div className="time-label-with-tooltip">
					<Tooltip {...rest} content={verboseDate}>
						{children}
					</Tooltip>
				</div>
			)

			TooltipContainer.propTypes = {
			  verboseDate: PropTypes.string,
			  children: PropTypes.node.isRequired
			}

			class Content extends React.Component
			{
				state = {
					alternativeLocale: 'ru-RU'
				}

				render()
				{
					const styles  = [undefined, 'twitter']
					const locales = ['en-US', 'ru-RU']

					const cases =
					[{
						title : 'Just now',
						date  : dates.recently
					},
					{
						title : 'A minute ago',
						date  : dates.a_minute_ago
					},
					{
						title : 'A couple of hours ago',
						date  : dates.two_hours_ago
					},
					{
						title : 'A day ago',
						date  : dates.a_day_ago
					},
					{
						title : 'A year ago',
						date  : dates.a_year_ago
					},
					{
						title : 'In 15 minutes (future date)',
						date  : dates.in_15_minutes,
						twitter : false
					}]

					return (
						<div>
							{TEST &&
								<div>
									<div>
										Alternative locale: {this.state.locale}
									</div>
									<div>
										<button onClick={() => this.setState({ alternativeLocale: 'en' })}>
											Change alternative locale
										</button>
									</div>
								</div>
							}

							{cases.map(({ title, date, twitter }) => (
								<div key={title} className="case">
									<h2>{title}</h2>

									<h3 className="locale"><code>locale="en"</code></h3>

									<div className="time-rows">
										<div className="time">
											<div className="timeStyle">
												<code className="code">timeStyle</code> <span className="not-specified">not specified</span>
											</div>
											<ReactTimeAgo locale="en-US" date={date} className="time-label"/>
										</div>

										<div className="time">
											<div className="timeStyle">
												<code className="code">timeStyle=<span className="string-value">"round"</span></code>
											</div>
											<ReactTimeAgo locale="en-US" timeStyle="round" date={date} className="time-label"/>
										</div>

										<div className="time">
											<div className="timeStyle">
												<code className="code">timeStyle=<span className="string-value">"round-minute"</span></code>
											</div>
											<ReactTimeAgo locale="en-US" timeStyle="round-minute" date={date} className="time-label"/>
										</div>

										{twitter !== false &&
											<div className="time">
												<div className="timeStyle">
													<code className="code">timeStyle=<span className="string-value">"twitter"</span></code>
												</div>
												<ReactTimeAgo locale="en-US" timeStyle="twitter" date={date} className="time-label"/>
											</div>
										}

										{twitter !== false &&
											<div className="time">
												<div className="timeStyle">
													<code className="code">timeStyle=<span className="string-value">"twitter-first-minute"</span></code>
												</div>
												<ReactTimeAgo locale="en-US" timeStyle="twitter-first-minute" date={date} className="time-label"/>
											</div>
										}
									</div>

									<h3 className="locale"><code>locale="ru"</code></h3>

									<div className="time">
										<div className="timeStyle">
											<code className="code">timeStyle</code> <span className="not-specified">not specified</span>
										</div>
										<ReactTimeAgo locale={this.state.alternativeLocale} date={date} className="time-label"/>
									</div>

									<div className="time">
										<div className="timeStyle">
											<code className="code">timeStyle=<span className="string-value">"round"</span></code>
										</div>
										<ReactTimeAgo locale={this.state.alternativeLocale} timeStyle="round" date={date} className="time-label"/>
									</div>

									<div className="time">
										<div className="timeStyle">
											<code className="code">timeStyle=<span className="string-value">"round-minute"</span></code>
										</div>
										<ReactTimeAgo locale={this.state.alternativeLocale} timeStyle="round-minute" date={date} className="time-label"/>
									</div>

									{twitter !== false &&
										<div className="time">
											<div className="timeStyle">
												<code className="code">timeStyle=<span className="string-value">"twitter"</span></code>
											</div>
											<ReactTimeAgo locale={this.state.alternativeLocale} timeStyle="twitter" date={date} className="time-label"/>
										</div>
									}

									{twitter !== false &&
										<div className="time">
											<div className="timeStyle">
												<code className="code">timeStyle=<span className="string-value">"twitter-first-minute"</span></code>
											</div>
											<ReactTimeAgo locale={this.state.alternativeLocale} timeStyle="twitter-first-minute" date={date} className="time-label"/>
										</div>
									}
								</div>
							))}

							<h2>With custom tooltip</h2>

							<div className="time-rows">
								<div className="time">
									<div className="timeStyle">
										<code className="code">timeStyle=<span className="string-value">"round"</span></code>
									</div>
									<ReactTimeAgoWithTooltip locale="en-US" timeStyle="round" date={cases[0].date}/>
								</div>
							</div>

							{/*
							<button onClick={() => this.setState({ alternativeLocale: 'fr' })}>
								Change locale
							</button>
							*/}
						</div>
					)
				}
			}

			ReactDOM.render
			(
				<Content />,
				document.getElementById('content')
			)
		</script>
	</body>
</html>
